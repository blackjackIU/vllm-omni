# Reference/rollback only: preserved community model.generate() runtime.
pipeline: vibevoice_legacy
async_chunk: false
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: false

stages:
  - stage_id: 0
    devices: "0"
    tokenizer: /data/models/Qwen2.5-1.5B
    max_num_seqs: 4
    kv_cache_memory_bytes: 67108864
    gpu_memory_utilization: 0.80
    enforce_eager: true
    async_scheduling: true
    max_model_len: 2
    max_num_batched_tokens: 8
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      detokenize: false
