# Full TP=2 VibeVoice profile. Both GPUs cooperate on one model replica.
# This file is deliberately self-contained: stage-list inheritance can drop
# nested compilation/env keys and silently turn cudagraph_copy_inputs off.
pipeline: vibevoice
async_chunk: true
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: true
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0,1"
    num_replicas: 1
    tensor_parallel_size: 2
    # This host failed the CUDA P2P probe, so use PyNCCL directly instead of
    # probing vLLM's custom all-reduce on every startup.
    disable_custom_all_reduce: true
    tokenizer: /data/models/Qwen2.5-1.5B
    max_num_seqs: 8
    max_model_len: 65536
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.88
    enforce_eager: false
    async_scheduling: false
    compilation_config:
      cudagraph_mode: PIECEWISE
      cudagraph_capture_sizes: [1, 2, 4, 8]
      cudagraph_num_of_warmups: 1
      # Required because each speech step replaces inputs_embeds with a latent
      # produced outside the runner-owned positive-Qwen graph.
      cudagraph_copy_inputs: true
    env:
      VLLM_OMNI_VIBEVOICE_COMPILE_DIFFUSION: "1"
      VLLM_OMNI_VIBEVOICE_COMPILE_CODEC: "1"
      VLLM_OMNI_VIBEVOICE_COMPILE_NEGATIVE_QWEN: "1"
      # A separately owned auxiliary graph cannot safely capture TP collectives.
      # Keep negative Qwen compiled/eager; positive Qwen uses vLLM graphs above.
      VLLM_OMNI_VIBEVOICE_GRAPH_NEGATIVE_QWEN: "0"
      VLLM_OMNI_VIBEVOICE_NEGATIVE_GRAPH_BATCH_SIZES: "1,2,4,8"
      VLLM_OMNI_VIBEVOICE_COMPILE_MODE: "default"
      VLLM_OMNI_VIBEVOICE_CONDITIONING_CACHE_SIZE: "128"
      VLLM_OMNI_VIBEVOICE_NOISE_POOL_STEPS: "256"
      VLLM_OMNI_VIBEVOICE_PROFILE_BATCH_SIZE: "8"
      VLLM_OMNI_VIBEVOICE_LOG_TOKEN_TRACE: "1"
      VLLM_OMNI_VIBEVOICE_TOKEN_TRACE_LIMIT: "64"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: false
      stop_token_ids: [151643]
