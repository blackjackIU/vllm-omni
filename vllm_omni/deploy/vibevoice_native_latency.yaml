# Native low-concurrency profile.
base_config: vibevoice.yaml
pipeline: vibevoice

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 2
    max_num_batched_tokens: 4096
    compilation_config:
      cudagraph_mode: PIECEWISE
      cudagraph_capture_sizes: [1, 2]
      cudagraph_num_of_warmups: 1
      cudagraph_copy_inputs: true
