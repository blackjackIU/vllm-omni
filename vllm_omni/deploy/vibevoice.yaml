# Native microsoft/VibeVoice-1.5B profile for one GPU.
# Qwen positive/negative CFG branches use distinct vLLM paged-KV namespaces.
pipeline: vibevoice
# The model emits delta PCM every AR step. The serving layer concatenates these
# chunks for non-stream requests and forwards them immediately for stream=true.
async_chunk: true
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: true
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0"
    # Keep startup offline/reproducible. The public serve command passes the
    # same local path explicitly; this stage value prevents the base profile
    # from silently falling back to Hugging Face Hub.
    tokenizer: /data/models/Qwen2.5-1.5B
    max_num_seqs: 8
    max_model_len: 65536
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.88
    enforce_eager: false
    # VibeVoice's sampled diffusion token produces the continuous embedding
    # consumed by the very next AR step. Optimistic async scheduling leaves
    # the runner's CPU token table one step behind, so the dynamic side path
    # sees a placeholder and never decodes PCM. Continuous batching remains
    # enabled with the synchronous scheduler.
    async_scheduling: false
    compilation_config:
      # The native Qwen layers are graphable. Diffusion/codec state transitions
      # stay outside the piecewise graph and use their own torch.compile path.
      cudagraph_mode: PIECEWISE
      cudagraph_capture_sizes: [1, 2, 4, 8]
      cudagraph_num_of_warmups: 1
      # The dynamic diffusion side path updates the runner's persistent input
      # embedding buffer immediately before positive-Qwen replay.  Copying graph
      # inputs prevents a replay from retaining a transient tensor address.
      cudagraph_copy_inputs: true
    env:
      VLLM_OMNI_VIBEVOICE_COMPILE_DIFFUSION: "1"
      VLLM_OMNI_VIBEVOICE_COMPILE_CODEC: "1"
      # The auxiliary Qwen pass cannot reuse the runner-owned positive graph.
      # Compile it with Inductor graph trees disabled, then capture model-owned
      # graphs for the common compact CFG batch widths.
      VLLM_OMNI_VIBEVOICE_COMPILE_NEGATIVE_QWEN: "1"
      VLLM_OMNI_VIBEVOICE_GRAPH_NEGATIVE_QWEN: "1"
      VLLM_OMNI_VIBEVOICE_NEGATIVE_GRAPH_BATCH_SIZES: "1,2,4,8"
      # Codec streaming caches are mutated in place.  Inductor's default mode
      # keeps the useful fusion/compile path without the CUDA Graph Trees that
      # reduce-overhead applies to stateful inputs.
      VLLM_OMNI_VIBEVOICE_COMPILE_MODE: "default"
      VLLM_OMNI_VIBEVOICE_CONDITIONING_CACHE_SIZE: "128"
      # Pre-generate independent per-request DDPM noise so decode steps gather
      # one batch tensor instead of launching one RNG kernel per active row.
      VLLM_OMNI_VIBEVOICE_NOISE_POOL_STEPS: "256"
      # Keep a bounded trace while the native parity backend is being brought
      # up. It records only special-token ids/state, never user text/audio.
      VLLM_OMNI_VIBEVOICE_LOG_TOKEN_TRACE: "1"
      VLLM_OMNI_VIBEVOICE_TOKEN_TRACE_LIMIT: "64"
      # Profile the full advertised concurrent side-path before vLLM assigns
      # remaining VRAM to paged KV blocks.
      VLLM_OMNI_VIBEVOICE_PROFILE_BATCH_SIZE: "8"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: false
      stop_token_ids: [151643]
